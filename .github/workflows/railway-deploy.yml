name: Deploy to Railway

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tradingassistant
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build -x test --no-daemon
    
    - name: Run tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tradingassistant
        SPRING_DATASOURCE_USERNAME: trading
        SPRING_DATASOURCE_PASSWORD: trading123
        BINANCE_TESTNET: true
      run: ./gradlew test --no-daemon

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Railway CLI
      run: npm install -g @railway/cli
    
    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
        railway up --service trading-assistant
    
    - name: Verify Deployment
      run: |
        echo "Waiting for deployment to be healthy..."
        sleep 30
        curl -f https://${{ secrets.RAILWAY_DOMAIN }}/actuator/health || exit 1
