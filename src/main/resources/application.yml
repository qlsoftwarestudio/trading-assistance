spring:
  application:
    name: trading-assistant
  
  datasource:
    # Priority: DB_* (manual Railway vars) > PG* (Railway auto-injected) > local defaults
    url: jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:tradingassistant}}
    username: ${DB_USER:${PGUSER:trading}}
    password: ${DB_PASSWORD:${PGPASSWORD:trading123}}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000,https://trading-assistance-front.vercel.app}

# Binance Configuration
app:
  migration:
    enabled: ${APP_MIGRATION_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:DEFAULT_SECRET_KEY_FOR_JWT_1234567890}
    expiration: ${JWT_EXPIRATION:86400000}
  encryption:
    key: ${ENCRYPTION_KEY:DEFAULT_SECRET_KEY_32BYTES!!}
  registration:
    invite-code: ${APP_REGISTRATION_INVITE_CODE:}
    enabled: ${APP_REGISTRATION_ENABLED:true}
  risk:
    max-capital-per-user-usd: ${APP_MAX_CAPITAL_PER_USER_USD:500.0}
  rate-limit:
    login-max-attempts: ${APP_RATE_LIMIT_LOGIN_MAX:5}
    login-window-seconds: ${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}

# Exchange selection: "binance" or "bingx"
exchange:
  active: ${EXCHANGE_ACTIVE:binance}

binance:
  api:
    key: ${BINANCE_API_KEY:}
    secret: ${BINANCE_SECRET_KEY:}
    base-url: ${BINANCE_BASE_URL:https://testnet.binancefuture.com}
    websocket-url: ${BINANCE_WS_URL:wss://testnet.binancefuture.com/ws}
  testnet: ${BINANCE_TESTNET:false}

bingx:
  api:
    key: ${BINGX_API_KEY:}
    secret: ${BINGX_SECRET_KEY:}
    base-url: ${BINGX_BASE_URL:https://open-api.bingx.com}

# Trading Strategy Configuration
trading:
  strategy:
    # FOREX pairs (BingX perp format handled internally: EURUSD→EUR-USD, USDJPY→USD-JPY)
    symbols: ${TRADING_STRATEGY_SYMBOLS:EURUSD,GBPUSD,USDJPY}
    timeframe: 5m
    rsi-length: 7
    rsi-oversold: 30
    rsi-overbought: 70
    lookback-bars: 12
    killzone-threshold: 30.0
    min-momentum: 0.1
    stop-loss-pct: 0.3        # Forex fallback SL (structural SL overrides when enabled)
    take-profit-pct: 0.6      # Fallback TP (2:1 vs fallback SL)
    position-size-pct: 15.0      # Lower risk per trade for small account ($400)
    leverage: 5                  # Reduced leverage to survive losing streaks
    enabled: true
    max-concurrent-trades: 1      # One trade at a time with small capital
    max-hold-minutes: 45
    require-rsi-reversal: false    # OFF: Stoch+BB + SMC structure/order-block provide confirmation
    # Risk Management
    use-atr-stop: true           # ATR-based SL with 2:1 auto TP (fallback when structural SL off)
    # Per-symbol SL%:TP% (2:1 R:R). Forex needs tight SL. JPY pairs quoted with 2-3 decimals.
    symbol-risk-config: ${TRADING_STRATEGY_SYMBOL_RISK_CONFIG:EURUSD:0.20:0.40,GBPUSD:0.25:0.50,USDJPY:0.20:0.40}
    # Per-symbol Bollinger Band period
    symbol-bb-period: ${TRADING_STRATEGY_SYMBOL_BB_PERIOD:EURUSD:25,GBPUSD:25,USDJPY:25}
    # Per-symbol RSI thresholds (forex tends to be less extreme than crypto)
    symbol-rsi-oversold: ${TRADING_STRATEGY_SYMBOL_RSI_OVERSOLD:EURUSD:35,GBPUSD:35,USDJPY:35}
    symbol-rsi-overbought: ${TRADING_STRATEGY_SYMBOL_RSI_OVERBOUGHT:EURUSD:65,GBPUSD:65,USDJPY:65}
    # Per-symbol trading session = ICT Kill Zones (UTC). Windows are '|'-separated.
    # 0-3 = Asia (Tokyo) | 7-10 = London | 12-15 = New York
    symbol-session-utc: ${TRADING_STRATEGY_SYMBOL_SESSION_UTC:EURUSD:0-3|7-10|12-15,GBPUSD:0-3|7-10|12-15,USDJPY:0-3|7-10|12-15}
    # ── SMC structure filters (NEW) ──────────────────────────────────────────────
    # HTF (H1) macro structure: block M5 SHORTs in bullish H1, LONGs in bearish H1
    use-htf-structure-filter: ${TRADING_STRATEGY_USE_HTF_STRUCTURE_FILTER:true}
    htf-timeframe: 1h
    htf-klines: 120
    htf-pivot-strength: 2         # Relaxed to allow more macro structure alignments
    # Order Blocks: M5 trigger only fires when price is inside a valid demand/supply OB
    use-order-block-filter: ${TRADING_STRATEGY_USE_ORDER_BLOCK_FILTER:true}
    ob-pivot-strength: 1          # More sensitive OB detection
    ob-displacement-atr: 1.0       # Less displacement required for valid OB
    ob-max-blocks: 10            # Keep more historical blocks alive
    # Structural SL + R:R filter: SL beyond last swing, TP at >=1:2, abort if unreachable
    use-structural-sl: ${TRADING_STRATEGY_USE_STRUCTURAL_SL:true}
    rr-min-ratio: 2.0
    structural-sl-buffer-pct: 0.05
    structural-sl-pivot-strength: 2
    structural-sl-lookback: 40
    structural-sl-max-pct: 1.5
    # Pure SMC entry mode: entries driven ONLY by H1 structure + Order Block + kill zone + R:R.
    # ALL legacy filters (BB, Stochastic, RSI, VWAP, EMA, rejection candle, sweep, breakout) bypassed.
    use-smc-entry: ${TRADING_STRATEGY_USE_SMC_ENTRY:true}
    trailing-stop-pct: 0.6        # Legacy — swing now uses below
    trailing-activation-pct: 0.6  # Legacy — swing now uses below
    # Swing trailing (5m): tight trail to capture profit when trade works
    swing-trailing-stop-pct: 0.25      # Tighter trail to lock small gains with $400 account
    swing-trailing-activation-pct: 0.5 # Activate trailing earlier for small-account capital protection
    breakeven-activation-pct: 0.4
    min-profit-pct: 0.15
    time-based-trail-pct: 0.5
    time-threshold-min: 10
    sl-cooldown-minutes: 10
    # Daily loss circuit breaker: stop trading for the day after this account loss percentage
    max-daily-loss-pct: 2.0
    # Partial TP: close 50% at 1:1 R, move SL to breakeven, trail remaining 50% to full TP
    partial-tp-enabled: true
    # Re-entry: if SL was hit < re-entry-window-minutes ago and setup still valid, allow entry with 50% size
    re-entry-enabled: true
    re-entry-window-minutes: 15
    # Range Breakout Strategy: enter on confirmed breakout of a tight consolidation range
    use-range-breakout: false        # OFF: bypassed in pure SMC mode
    breakout-lookback: 20
    breakout-max-range-pct: 2.5
    breakout-volume-multiplier: 2.5
    min-sl-update-distance-pct: 0.1  # Min distance between current price and new SL before updating Binance (avoids "immediately trigger" errors)
    # Dynamic position sizing: adjust size based on volatility (ATR)
    position-size-volatility-adjust: true
    position-size-atr-lookback: 50
    position-size-high-vol-factor: 0.5
    position-size-low-vol-factor: 1.5
    position-size-volatility-threshold: 1.5
    # Momentum exit: DISABLED — redundant with trailing stop + time exit
    momentum-exit-enabled: false
    momentum-exit-drop-pct: 70.0
    momentum-exit-progress-threshold: 0.5
    momentum-exit-min-hold-minutes: 15
    # Auto-adjust: disable setups with poor performance automatically
    auto-adjust-enabled: true
    auto-adjust-min-trades: 20
    auto-adjust-win-rate-threshold: 0.30
    auto-adjust-lookback-days: 30
    # Delta volume filter: estimate buy/sell pressure from candle close position
    use-delta-volume-filter: false   # OFF: counterproductive for mean-reversion (price at BB extreme always shows opposite pressure)
    delta-volume-threshold: 0.30
    use-vwap-filter: false           # OFF: bypassed in pure SMC mode
    vwap-period: 20
    vwap-band-pct: 1.5
    use-ema-filter: false
    ema-period: 9
    ema-extreme-rsi-threshold: 15
    oversold-spike-rsi-threshold: 20
    oversold-spike-volume-threshold: 2.0
    atr-period: 10
    projection-candles-ahead: 6
    atr-multiplier: 6.0       # Tuned for ~2.5% SL on SOL 5m (ATR ~0.4% × 6 = 2.4%)
    max-atr-sl-pct: 2.5       # Hard cap on ATR-based SL
    use-regression-filter: true
    regression-lookback: 50
    # Breakout + Trend-Dip: DISABLED — bot now operates ONLY Mean-Reversion at BB extremes
    use-breakout: false                # OFF: no breakout entries (only reversal at BB extremes)
    use-trend-dip-long: false          # OFF: no trend-dip entries (only reversal at BB extremes)
    trend-dip-rsi-threshold: 45        # Legacy param (inactive)
    trend-dip-channel-slope: 0.02      # Legacy param (inactive)
    # Anti-pump/anti-crash: DISABLED — redundant with Stoch+BB + Liquidity Sweep filters
    # These filters rejected shorts in uptrend/canal and longs in downtrend/canal
    # But now we ONLY enter at BB extremes with sweep confirmation, which is valid even in strong trends
    anti-pump-slope-threshold: 999.0    # Disabled (set to extreme value so condition never triggers)
    anti-crash-slope-threshold: 999.0    # Disabled (set to extreme value so condition never triggers)
    # Short-in-uptrend protection: require higher RSI + higher volume when shorting into uptrend
    rsi-overbought-uptrend: 85
    short-min-volume-uptrend: 2.0
    short-min-conditions-uptrend: 2
    # 1h trend filter: DISABLED — redundant with VWAP filter + Stoch+BB at extremes
    use-trend1h-mean-rev-filter: false
    block-short-on-4h-uptrend: false  # OFF: HTF(H1) structure filter now governs trend direction
    # EMA 200 daily macro filter (per-symbol)
    # price > EMA200(1d) → only LONGs allowed | price < EMA200(1d) → only SHORTs allowed
    ema200-filter-symbols:              # Empty: HTF(H1) structure replaces daily EMA200 macro gate
    # Stochastic + Bollinger Bands confirmation filter
    use-stoch-bb-filter: false       # OFF: replaced by pure SMC entry (Order Block + H1 structure)
    stoch-period: 14                 # Stochastic lookback period (standard: 14)
    stoch-smooth-k: 3                # %K smoothing (standard: 3)
    stoch-smooth-d: 3                # %D smoothing (standard: 3)
    stoch-oversold: 15               # %K 5m threshold for LONG confirmation (price at extremes)
    stoch-overbought: 85             # %K 5m threshold for SHORT confirmation (price at extremes)
    stoch-15m-long-max: 50           # 15m stoch must be BELOW this for LONG (confirming 15m is not in uptrend)
    stoch-15m-short-min: 50          # 15m stoch must be ABOVE this for SHORT (confirming 15m is not in downtrend)
    bb-period: 20                    # Bollinger Bands SMA period — global fallback (overridden per-symbol by symbol-bb-period)
    bb-std-dev: 2.0                  # Standard deviations (standard: 2.0)
    bb-proximity-pct: 0.3            # Price must be within 0.3% of BB band — tighter = entries closer to extremes
    use-bb-based-sl: true           # Tighten SL to BB band when enabled
    bb-sl-buffer-pct: 0.1            # Buffer below BB lower (for LONG SL) as % of band price
    # Rejection candle filter: require wick-based reversal candle at BB extremes
    use-rejection-candle-filter: false  # OFF: Order Block + HTF structure now provide the context (was over-filtering)
    rejection-candle-min-wick-ratio: 1.0 # Wick must be >= 1× body size (relaxed from 2.0 — easier to satisfy)
    rejection-candle-bypass-rsi: 74.0    # Bypass wick check entirely when RSI > this (extreme overbought/oversold)
    stoch-overbought-macro-down: 70.0    # Relaxed stoch threshold for SHORTs when macro=DOWN (price < EMA200 1d); normal=85
    ema200-long-bypass-rsi: 20.0         # Allow LONGs even in macro=DOWN when RSI < this (extreme oversold counter-trend bounce)
    # Liquidity sweep filter: detect price sweeping recent swing high/low with long wick + close back
    use-liquidity-sweep-filter: false   # OFF: Order Block gate replaces raw liquidity-sweep confirmation
    liquidity-sweep-lookback: 5          # Look back N candles for swing high/low to sweep

    # Balance filter: reject breakouts when market is in consolidation/chop (Fabio AMT)
    use-balance-filter: false          # OFF: HTF structure + Order Block handle chop avoidance
    balance-lookback-short: 20          # Short ATR window (candles)
    balance-lookback-long: 50           # Long ATR window (baseline)
    balance-atr-compression-ratio: 0.30 # Short ATR / Long ATR < 0.30 = balance
    # Absorption filter: high volume + small candle range = institutional footprint
    use-absorption-filter: false         # OFF by default — experimental (requires volume spike + small range at key level)
    absorption-volume-multiplier: 1.5    # Current volume must be > 1.5× average
    absorption-range-multiplier: 0.5    # Candle range must be < 50% of recent ATR

  # Trading Session Filter (skip low-volume sessions) — disabled by default
  session-filter:
    enabled: false
    asia-start: 2      # 02:00 UTC
    asia-end: 8        # 08:00 UTC

  # Market Context / Multi-timeframe Analysis
  context:
    enabled: true              # ON: collect 1h/4h/1d trend data (shows in UI) — but does NOT reject trades
    require-confluence: false  # OFF: no rejection by trend confluence
    require-volume: false      # OFF: no rejection by volume
    min-volume-ratio: 1.2
    btc-correlation-symbols: ${TRADING_CONTEXT_BTC_CORRELATION_SYMBOLS:SOLUSDT,BTCUSDT,ETHUSDT}

  # Historical Performance & Auto-Adjustment
  performance:
    auto-adjust: false
    min-samples: 20
    adjustment-delta-pct: 5.0

  # Risk Management
  risk:
    max-daily-loss-pct: 8.0
    min-notional: 5.0

# Telegram Configuration
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    enabled: ${TELEGRAM_ENABLED:false}

# Logging
logging:
  level:
    com.trading.assistant: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
