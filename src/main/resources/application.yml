spring:
  application:
    name: trading-assistant
  
  datasource:
    # Priority: DB_* (manual Railway vars) > PG* (Railway auto-injected) > local defaults
    url: jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:tradingassistant}}
    username: ${DB_USER:${PGUSER:trading}}
    password: ${DB_PASSWORD:${PGPASSWORD:trading123}}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000,https://trading-assistance-front.vercel.app}

# Binance Configuration
binance:
  api:
    key: ${BINANCE_API_KEY:}
    secret: ${BINANCE_SECRET_KEY:}
    base-url: ${BINANCE_BASE_URL:https://testnet.binancefuture.com}
    websocket-url: ${BINANCE_WS_URL:wss://testnet.binancefuture.com/ws}
  testnet: ${BINANCE_TESTNET:true}

# Trading Strategy Configuration
trading:
  strategy:
    symbol: HYPEUSDT
    timeframe: 5m
    rsi-length: 7
    rsi-oversold: 40
    rsi-overbought: 60
    lookback-bars: 12
    killzone-threshold: 30.0
    min-momentum: 0.05
    stop-loss-pct: 0.2
    take-profit-pct: 0.4
    position-size-pct: 10.0
    leverage: 5
    enabled: true
    max-concurrent-trades: 2
    max-hold-minutes: 30
    require-rsi-reversal: true
    # Risk Management - ATR-based dynamic stop (recommended for volatile assets)
    # When enabled: SL = entry ± (ATR * multiplier), TP = 2x risk (reward/risk = 2:1)
    use-atr-stop: true
    atr-period: 10
    atr-multiplier: 1.5

  # Market Context / Multi-timeframe Analysis
  context:
    enabled: false
    require-confluence: false
    require-volume: false
    min-volume-ratio: 1.2

  # Historical Performance & Auto-Adjustment
  performance:
    auto-adjust: false
    min-samples: 20
    adjustment-delta-pct: 5.0

# Telegram Configuration
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    enabled: ${TELEGRAM_ENABLED:false}

# Logging
logging:
  level:
    com.trading.assistant: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
