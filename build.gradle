plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0'
	id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.trading'
version = '0.0.1-SNAPSHOT'
description = 'Trading Assistant - BTCUSD 15m SOLO LONG Strategy'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	
	// Database
	runtimeOnly 'org.postgresql:postgresql'
	
	// WebClient for REST calls to Binance Futures API
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	
	// Telegram Bot
	implementation 'org.telegram:telegrambots:6.9.7.1'
	
	// OpenAPI/Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	
	// JAXB API (removed in JDK 21, required by some transitive dependencies)
	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Create fat jar for Railway
tasks.named('bootJar') {
	archiveFileName = 'trading-assistant.jar'
}
